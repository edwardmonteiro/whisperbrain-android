name: Founder Data Hub APK

on:
  push:
    branches: [ founder-data-hub-mvp ]
    paths:
      - 'founder-data-hub/**'
      - '.github/workflows/founder-data-hub-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: founder-data-hub
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeGraph-Founder-debug
          path: founder-data-hub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
