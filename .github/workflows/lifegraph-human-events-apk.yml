name: LifeGraph Human Events APK

on:
  push:
    branches: [ lifegraph-v2-human-events ]
    paths:
      - 'founder-data-hub/**'
      - '.github/workflows/lifegraph-human-events-apk.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tests
        working-directory: founder-data-hub
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        working-directory: founder-data-hub
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeGraph-Human-Events-debug
          path: founder-data-hub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
