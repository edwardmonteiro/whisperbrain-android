name: Build InsideVoice

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insidevoice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source only
        run: git archive --format=zip HEAD -o InsideVoice-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: InsideVoice-source
          path: InsideVoice-source.zip
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Check intervention behavior
        run: |
          mkdir -p build/policy-checks
          javac -d build/policy-checks app/src/main/java/com/edward/whisperbrain/AdvicePolicy.java checks/PolicyChecks.java
          java -cp build/policy-checks PolicyChecks
      - name: Compile, test, and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Save installable evaluation APK
        uses: actions/upload-artifact@v4
        with:
          name: InsideVoice-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Download/whisperbrain-qa app/build/reports/notebook-screenshots || true
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InsideVoice-validation
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/
            app/build/reports/notebook-screenshots/
          if-no-files-found: ignore
          retention-days: 14
